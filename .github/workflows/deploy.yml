name: Weekly Communication Licenses Registry Update (Roskomnadzor)

on:
  schedule:
    - cron: '37 6 * * 3'        # 06:37 UTC (09:37 МСК) по средам — свободный слот
  workflow_dispatch:            # ручной запуск

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write           # встроенный токен Actions для коммита
    env:
      # API-токен Kaggle (CLI >= 1.8.0).
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_SVYAZ_LICENSES }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI с поддержкой API-токенов (>= 1.8.0)
        run: |
          pip install -q --upgrade kaggle
          kaggle --version
          python - <<'EOF'
          import re, subprocess
          out = subprocess.check_output(["kaggle", "--version"], text=True).strip()
          m = re.search(r"(\d+)\.(\d+)", out)
          assert m and tuple(map(int, m.groups())) >= (1, 8), \
              f"нужен kaggle CLI >= 1.8.0 для API-токенов, получен: {out}"
          print("OK: kaggle CLI поддерживает API-токены")
          EOF

      - name: Download latest kernel output
        run: |
          mkdir -p ./output
          kaggle kernels output eavprog/svyaz-licenses-downloader -p ./output
          echo "Содержимое output:"
          find ./output -maxdepth 4 -type f | head -30

      - name: Copy web files to repo root (только .gz)
        id: copy
        run: |
          # Публикуем ТОЛЬКО .gz файлы (стандарт v-next.2)
          SRC=./output/svyaz_licenses_data/web
          MISSING=0
          for f in svyaz_licenses.json.gz svyaz_licenses_meta.json.gz; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "./$f"
              echo "copied $f"
            else
              echo "::warning::MISSING $f в $SRC (тетрадка, вероятно, упала или писала не туда)"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ Отсутствует $MISSING из 2 файлов — коммит пропущен, сайт остаётся на последней хорошей версии"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
          else
            echo "✅ Все 2 файла на месте"
            echo "FILES_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Commit and push changes
        if: env.FILES_OK == 'true'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add svyaz_licenses.json.gz svyaz_licenses_meta.json.gz
          if git diff --cached --quiet; then
            echo "✅ Изменений нет — данные уже актуальны"
          else
            # Извлекаем дату из .gz без распаковки в файл
            SOURCE_DATE=$(gzip -d -c svyaz_licenses_meta.json.gz | python -c "import sys, json; print(json.load(sys.stdin).get('source_date','?'))")
            git commit -m "Auto-update: Communication licenses registry data (source $SOURCE_DATE) [skip ci]"
            git push
            echo "✅ Изменения запушены"
          fi

      - name: Trigger new notebook run (fire-and-forget, всегда)
        if: always()
        run: |
          mkdir -p ./nb
          kaggle kernels pull eavprog/svyaz-licenses-downloader -p ./nb --metadata
          kaggle kernels push -p ./nb
          echo "✅ Тетрадка перезапущена (round-trip); workflow не ждёт её завершения"
